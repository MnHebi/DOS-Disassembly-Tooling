name: Test and package Linux / Windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and build tools
        run: python -m pip install -e ".[dev,mcp]"
      - name: Focused tests
        run: python -m pytest -q
      - name: Freeze native launcher
        run: python -m PyInstaller --noconfirm --clean --onedir --name ddt packaging/launcher.py
      - name: Linux native smoke
        if: runner.os == 'Linux'
        run: python scripts/smoke.py ./dist/ddt/ddt
      - name: Windows native smoke
        if: runner.os == 'Windows'
        run: python scripts/smoke.py ./dist/ddt/ddt.exe
      - name: Package binary distribution
        run: python scripts/archive_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: DDT-${{ runner.os }}-x86_64
          path: release/*.zip
          if-no-files-found: error
