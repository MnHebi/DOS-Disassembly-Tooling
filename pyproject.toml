[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dos-disassembly-tooling"
version = "0.1.0"
description = "Portable, read-only foundations for DOS executable reverse engineering"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "DDT contributors" }]
keywords = ["dos", "reverse-engineering", "mz", "binary-diff"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
ddt = "ddt.cli:main"
ddt-mcp = "ddt.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ddt = ["ghidra_scripts/*.java"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
